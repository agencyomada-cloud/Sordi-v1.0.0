server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # Hashed build assets (Vite fingerprints every file in /assets) can be
    # cached forever — a content change always produces a new filename, so
    # there's never a stale-cache problem to worry about here.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Anything under /assets/screenshots isn't necessarily Vite-hashed (a
    # real product screenshot dropped in by hand, see DesktopShowcase.tsx) —
    # cache it, but revalidate rather than treating it as immutable.
    location /assets/screenshots/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA fallback — every unmatched path serves index.html so client-side
    # routing (and a hard refresh on any route) works correctly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
