services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sordi
      POSTGRES_PASSWORD: sordi_dev_password
      POSTGRES_DB: sordi
    ports:
      # Mapped to 5434 (not the default 5432) so this never collides with a
      # Postgres instance you might already be running locally.
      - "5434:5432"
    volumes:
      - sordi_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sordi -d sordi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sordi_pg_data:
