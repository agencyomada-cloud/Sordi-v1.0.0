[package]
name = "sordi"
version = "1.0.0"
description = "Sordi"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
# Needed once a second binary (src/bin/keygen.rs) existed in this package —
# without it, plain `cargo run` (what `tauri dev` invokes internally) can no
# longer infer which binary to run and errors out instead of launching the
# app. `cargo run --bin keygen` still works explicitly either way.
default-run = "sordi"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-log = "2"
# Native "pick a file" dialog (employee photo/document upload) and "open with
# OS default app" (the documents list's "Ouvrir" button) — neither existed
# in this app before; the prior image-upload precedent (Settings logo/stamp)
# was a plain <input type=file> + base64 data URI, which doesn't give an
# absolute filesystem path or a way to launch the OS viewer.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Persists the widget window's position/size across app restarts (main
# window is excluded via a denylist — its sizing is deliberately fixed by
# tauri.conf.json's own minWidth/minHeight, not user-resizable).
tauri-plugin-window-state = "2"
# Employee photo resize/re-encode on upload (pure-Rust codecs, no system
# image library dependency).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rusqlite = { version = "0.31", features = ["bundled", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
headless_chrome = { version = "1.0", features = ["fetch"] }
base64 = "0.21"
# License token verification (Ed25519/EdDSA) — a different, unrelated crate
# from the Node "jsonwebtoken" npm package that signs these on the server
# side, but both produce/consume the same standard JWT format.
jsonwebtoken = "9"
sha2 = "0.10"
# Only used for the two license HTTP calls (activate/verify) — rustls-tls
# avoids an OpenSSL system dependency for a desktop app that gets built on
# multiple platforms.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Document email dispatch (send_email_with_pdf) — rustls-tls again to match
# reqwest's choice above rather than pulling in a native OpenSSL dependency.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }

# Native Touch ID / biometric authentication for the login screen.
# tauri-plugin-biometric only targets Android/iOS (the mobile bridge), not a
# regular windowed macOS app, so this talks to Apple's LocalAuthentication
# framework directly through the objc2 bindings. macOS-only: on Windows/
# Linux, authenticate_biometric compiles to a stub that just returns an
# error, so the rest of the app is unaffected.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = "0.3"
block2 = "0.6"

[dev-dependencies]
# "test" feature gates the tauri::test module (mock_builder, MockRuntime,
# get_ipc_response/assert_ipc_response) — dev-only, doesn't affect the real
# app build since [dev-dependencies] only applies to `cargo test`.
tauri = { version = "2.9.5", features = ["test"] }
# Only for #[tokio::test] on license::activate() (an async fn) — already a
# transitive dependency via reqwest's async client, just not previously
# nameable from our own test code without being a direct dependency too.
# Dev-only, doesn't affect the real app build.
tokio = { version = "1", features = ["macros", "rt"] }

[features]
# omada-agency branch only, never enabled by default — see license.rs's
# require_active_license(). A real Sordi build (this feature absent or not
# passed via --features) is completely unaffected; even an accidental merge
# of this code elsewhere stays inert unless someone explicitly opts in.
omada_bypass = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
